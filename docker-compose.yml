version: '3.8'

services:
  fraud-detection-gui:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models
      - ./creditcard.csv:/app/creditcard.csv:ro
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0

  fraud-detection-api:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./models:/app/models
      - ./creditcard.csv:/app/creditcard.csv:ro
    environment:
      - FLASK_ENV=production
    command: python api.py

volumes:
  models:
  data:
